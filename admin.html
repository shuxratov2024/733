<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>733.uz | Boshqaruv Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            min-height: 100vh;
        }

        /* YON PANEL (SIDEBAR) */
        .sidebar {
            width: 260px;
            background: #0a0a0a;
            border-right: 1px solid #1a1a1a;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }
        .brand {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: #555; font-size: 0.9rem; }
        
        .nav-links { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-link {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; border-radius: 8px;
            color: #888; text-decoration: none; font-size: 0.95rem;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background: #111; color: #fff;
        }
        .nav-link svg { width: 18px; height: 18px; fill: currentColor; }

        /* ASOSIY QISM */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px;
        }
        .header h1 { font-size: 1.8rem; font-weight: 500; }
        .user-profile {
            display: flex; align-items: center; gap: 12px;
            background: #111; padding: 8px 16px; border-radius: 50px;
            border: 1px solid #1a1a1a; font-size: 0.9rem; color: #aaa;
        }

        /* FORMA KARTASI */
        .card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 32px;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .form-group { margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        
        input, textarea {
            width: 100%;
            background: #000;
            border: 1px solid #222;
            color: #fff;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        input:focus, textarea:focus { border-color: #555; background: #050505; }
        textarea { resize: vertical; min-height: 250px; line-height: 1.6; }
        
        .btn-submit {
            background: #fff;
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-submit:hover { background: #ccc; transform: translateY(-2px); }

        /* MOBIL MOSLASHUV */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; padding: 20px; border-right: none; border-bottom: 1px solid #1a1a1a; flex-direction: row; justify-content: space-between; align-items: center; }
            .brand { margin-bottom: 0; }
            .nav-links { display: none; /* Telefonda menyuni yashirish yoki burger tugma qilish mumkin */ }
            .main-content { padding: 20px; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- YON PANEL -->
    <aside class="sidebar">
        <div class="brand">
            733.UZ <span>Admin</span>
        </div>
        <nav class="nav-links">
            <a href="#" class="nav-link active">
                <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                Yangi Maqola
            </a>
            <a href="#" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
                Maqolalar Ro'yxati
            </a>
            <a href="index.html" class="nav-link" style="margin-top: auto; color: #555;">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                Saytga qaytish
            </a>
        </nav>
    </aside>

    <!-- ASOSIY QISM -->
    <main class="main-content">
        <header class="header">
            <h1>Maqola Yozish</h1>
            <div class="user-profile">
                Amir Shukhratov
            </div>
        </header>

        <div class="card">
            <form id="article-form">
                <div class="form-group">
                    <label for="title">Sarlavha</label>
                    <input type="text" id="title" placeholder="Masalan: JavaScript da event loop qanday ishlaydi?" required>
                </div>
                
                <div class="form-group">
                    <label for="desc">Qisqa ta'rif (Excerpt)</label>
                    <input type="text" id="desc" placeholder="Bosh sahifadagi ro'yxatda ko'rinadigan qisqacha mazmun" required>
                </div>

                <div class="form-group">
                    <label for="content">To'liq matn (Markdown yozish mumkin)</label>
                    <textarea id="content" placeholder="Maqola matnini shu yerga kiriting..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    <svg style="width: 18px; height: 18px; fill: currentColor;" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    Chop etish
                </button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('article-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const desc = document.getElementById('desc').value;
            const content = document.getElementById('content').value;
            const date = new Date().toLocaleDateString('uz-UZ', { year: 'numeric', month: 'long', day: 'numeric' });

            const btn = e.target.querySelector('button');
            btn.innerHTML = 'Saqlanmoqda...';

            setTimeout(() => {
                // Eski maqolalarni olamiz
                const articles = JSON.parse(localStorage.getItem('my_articles') || '[]');
                
                // Yangisini qo'shamiz
                articles.push({ title, desc, content, date });
                
                // Qayta saqlaymiz
                localStorage.setItem('my_articles', JSON.stringify(articles));

                alert("Maqola muvaffaqiyatli saqlandi! Saytga o'tib ko'ring.");
                e.target.reset();
                btn.innerHTML = `Chop etish`;
            }, 500);
        });
    </script>
</body>
</html>
